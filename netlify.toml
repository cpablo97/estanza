[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Public identifiers (also visible in every CDN image URL); values here override the Netlify UI.
  PUBLIC_SANITY_PROJECT_ID = "5j5yx4z7"
  PUBLIC_SANITY_DATASET = "production"
  PUBLIC_SITE_URL = "https://www.estanzacx.com"

# The Sanity webhook (Studio → API → Webhooks) should POST to a Netlify Build Hook
# on create/update/delete of the "landing" and "settings" documents.

# The old Netlify subdomain forwards to the custom domain so there is one canonical site.
[[redirects]]
  from = "https://estanzacx.netlify.app/*"
  to = "https://www.estanzacx.com/:splat"
  status = 301
  force = true

# Security headers for every response (no CSP yet: the inline style="--i" attributes would need unsafe-inline).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# styles.css and the scripts are referenced with ?v=<commit>, so they can be cached for good.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
